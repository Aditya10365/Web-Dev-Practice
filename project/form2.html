<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/submit-form-endpoint" method="POST">
        <!-- Input elements go here -->
         <!-- Single-line text -->
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="e.g., janesmith"><br/><br/>

        <!-- Hidden password characters -->
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="password"><br/><br/>

        <!-- Multi-line text box -->
        <label for="bio">Biography:</label>
        <textarea id="bio" name="user_bio" rows="4" cols="50"></textarea><br/><br/>
        <!-- Radio Buttons: Choose only one -->
        <p>Choose your subscription tier:</p>
        <input type="radio" id="free" name="tier" value="free">
        <label for="free">Free Tier</label>

        <input type="radio" id="premium" name="tier" value="premium">
        <label for="premium">Premium Tier</label>

        <!-- Checkboxes: Choose any -->
        <p>Interests:</p>
        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="design" name="interests" value="design">
        <label for="design">Design</label>
        <br/><br/>

        <label for="cars">Choose a car:</label>
        <select id="cars" name="car_brand">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="fiat">Fiat</option>
        </select>
        <br/><br/>
        <!-- Restricts to email format -->
        <input type="email" id="email" name="user_email">
        <br/><br/>

        <!-- Shows a calendar picker -->
        <input type="date" id="birthday" name="bday">
        <br/><br/>

        <!-- Restricts to digits only -->
        Enter your age:
        <input type="number" id="quantity" name="quantity" min="18">
        <br/><br/>

        <!-- File uploader -->
        <input type="file" id="resume" name="user_resume">
        <br/><br/>
        <!-- The modern/preferred way -->
        <button type="submit">Submit Form</button>

        <!-- The old school way
        <input type="submit" value="Submit Form"> -->
        <!--This field is mandatory and must be at least 8 characters long 
        <input type="password" id="secret" name="password" required minlength="8"> -->

    </form>
</body>
</html>
